  <circle cx="52" cy="15" r="5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="260" y="19" fill="#7d8590" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">cjmaybe@github: ~$ neofetch</text>

  <!-- ========== USER / HEADER ========== -->
  <g opacity="0" transform="translate(20, 55)">

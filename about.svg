</g>

<!-- ========== SOCIAL LINKS ========== -->
<g opacity="0" transform="translate(20, 385)">
  <text fill="#c9d1d9" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <tspan fill="#58a6ff">GitHub</tspan>
    <tspan fill="#7d8590">  ▸  </tspan>
    <tspan fill="#c9d1d9">cjmaybe</tspan>
    <tspan fill="#7d8590">  │  </tspan>
    <tspan fill="#f0883e">LinkedIn</tspan>
    <tspan fill="#7d8590">  ▸  </tspan>
    <tspan fill="#c9d1d9">cjmaybe</tspan>
